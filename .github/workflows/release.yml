name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Package (${{ matrix.name }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platforms: darwin/arm64,darwin/amd64
            targets: darwin-arm64,darwin-amd64
          - name: Windows-Linux
            os: ubuntu-latest
            platforms: windows/amd64,linux/amd64
            targets: windows-amd64,linux-amd64
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Validate tag and changelog
        run: go run ./cmd/releasecheck -tag "$GITHUB_REF_NAME" -repository "$GITHUB_REPOSITORY"
      - name: Install Windows installer tool
        if: runner.os == 'Linux'
        run: |
          if ! command -v makensis > /dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y nsis
          fi
      - name: Build and sign update archives
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo 'Missing repository secret MYGO_UPDATER_PRIVATE_KEY'
            exit 1
          fi
          go tool mygo build -platform "$PLATFORMS"
      - name: Verify signed artifacts
        env:
          TARGETS: ${{ matrix.targets }}
        run: >-
          go run ./cmd/releasecheck -tag "$GITHUB_REF_NAME"
          -repository "$GITHUB_REPOSITORY" -artifacts build -targets "$TARGETS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/*/*.dmg
            app/build/*/*-setup-*.exe
            app/build/*/*.deb
            app/build/*/*.tar.gz
            app/build/*/*.delta
            app/build/*/update-*.json
            app/build/*/install.sh
            app/build/*/install.ps1

  publish:
    name: Verify and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          path: downloaded-artifacts
      - name: Verify every target and assemble release
        run: >-
          go run ./cmd/releasecheck -tag "$GITHUB_REF_NAME"
          -repository "$GITHUB_REPOSITORY" -artifacts ../downloaded-artifacts
          -stage "$RUNNER_TEMP/release-assets" -notes "$RUNNER_TEMP/release-notes.md"
      - name: Upload all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          latest=true
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
            latest=false
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/is-draft")" != true ]; then
              echo 'Refusing to replace an already published release'
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "见山 $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release-assets/* \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest="$latest" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
